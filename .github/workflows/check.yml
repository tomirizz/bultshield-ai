name: Check foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: bultshield
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: bultshield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bultshield -d bultshield_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://bultshield:ci-test-only@127.0.0.1:5432/bultshield_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check --config backend/pyproject.toml backend scripts
      - run: python scripts/check_backend.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
