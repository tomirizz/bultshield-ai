name: Check BultShield
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: bultshield
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: bultshield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bultshield -d bultshield_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://bultshield:ci-test-only@127.0.0.1:5432/bultshield_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check --config backend/pyproject.toml backend scripts
      - name: Install pinned Gitleaks CLI for integration tests
        run: |
          docker create --name gitleaks-cli ghcr.io/gitleaks/gitleaks:v8.30.1
          docker cp gitleaks-cli:/usr/bin/gitleaks /tmp/gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          docker rm gitleaks-cli
          gitleaks version
      - name: Install isolated Semgrep CE for integration tests
        run: |
          python -m venv /tmp/semgrep
          /tmp/semgrep/bin/pip install -r backend/requirements-semgrep.txt
          sudo ln -s /tmp/semgrep/bin/semgrep /usr/local/bin/semgrep
      - name: Install SHA256-verified Trivy CLI
        run: sudo python scripts/install_trivy.py
      - run: python scripts/check_backend.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
