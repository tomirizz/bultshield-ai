# Local verification only. Production services are created on Bult.ai.
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: bultshield
      POSTGRES_USER: bultshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bultshield -d bultshield"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://bultshield:${POSTGRES_PASSWORD}@postgres:5432/bultshield
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
